name: Publish Instagram API image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "instagram-api/**"
      - ".github/workflows/publish-instagram-api-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: instagram-api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/copynews-instagram-api:latest
            ghcr.io/${{ github.repository_owner }}/copynews-instagram-api:${{ github.sha }}
