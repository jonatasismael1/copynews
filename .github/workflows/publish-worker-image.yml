name: Publish worker image

on:
  push:
    branches: [main]
    paths:
      - worker/**
      - docker-compose.contabo.yml
      - .github/workflows/publish-worker-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          push: true
          tags: |
            ghcr.io/jonatasismael1/copynews-worker:latest
            ghcr.io/jonatasismael1/copynews-worker:${{ github.sha }}
