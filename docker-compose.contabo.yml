services:
  copy-news-worker:
    image: ghcr.io/jonatasismael1/copynews-worker:latest
    environment:
      PORT: "8080"
      SUPABASE_URL: "https://supabase1.dbe.digital"
      SUPABASE_SECRET_KEY_FILE: "/run/secrets/copynews_supabase_secret_key"
      EXPECTED_SUPABASE_HOST: ${EXPECTED_SUPABASE_HOST:-supabase1.dbe.digital}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4.1-mini}
      OPENROUTER_REWRITE_MODEL: ${OPENROUTER_REWRITE_MODEL:-openai/gpt-4.1}
      OPENROUTER_TRANSCRIPTION_MODEL: ${OPENROUTER_TRANSCRIPTION_MODEL:-openai/whisper-large-v3}
      OPENROUTER_VISION_MODEL: ${OPENROUTER_VISION_MODEL:-openai/gpt-4.1-mini}
      COBALT_API_URL: ${COBALT_API_URL:-https://cobalt.dbe.digital}
      COBALT_API_KEY: ${COBALT_API_KEY}
      WORKER_ID: ${WORKER_ID:-contabo-worker-1}
      TEMP_MEDIA_BUCKET: ${TEMP_MEDIA_BUCKET:-temporary-media}
      TEMP_MEDIA_TTL_MINUTES: ${TEMP_MEDIA_TTL_MINUTES:-120}
      TRANSCRIPTION_CHUNK_SECONDS: ${TRANSCRIPTION_CHUNK_SECONDS:-600}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Maceio}
      DISTRIBUTION_EVOLUTION_URL: ${DISTRIBUTION_EVOLUTION_URL:-https://evo.dbe.digital}
      DISTRIBUTION_EVOLUTION_INSTANCE: ${DISTRIBUTION_EVOLUTION_INSTANCE:-enviarcopynews}
      DISTRIBUTION_EVOLUTION_API_KEY: ${DISTRIBUTION_EVOLUTION_API_KEY}
      DISTRIBUTION_TEST_MODE: ${DISTRIBUTION_TEST_MODE:-true}
      DISTRIBUTION_TEST_PHONE: ${DISTRIBUTION_TEST_PHONE:-5582998264805}
    secrets:
      - copynews_supabase_secret_key
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 10

secrets:
  copynews_supabase_secret_key:
    external: true
