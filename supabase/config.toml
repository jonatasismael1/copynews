project_id = "copy-news"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.vector]
enabled = false

[auth]
site_url = "https://copynews.netlify.app"
additional_redirect_urls = ["https://copynews.netlify.app/**"]
enable_signup = false
minimum_password_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[functions.admin-users]
verify_jwt = true
[functions.process-source-url]
verify_jwt = true
[functions.revise-news-field]
verify_jwt = true
[functions.create-publication]
verify_jwt = true
[functions.record-metrics]
verify_jwt = true
[functions.temporary-media-url]
verify_jwt = true
[functions.prepare-design-media]
verify_jwt = true
[functions.retry-processing-step]
verify_jwt = true
[functions.cleanup-temporary-media]
verify_jwt = false
[functions.manage-news]
verify_jwt = true
[functions.manage-publications]
verify_jwt = true
[functions.inspect-publication-url]
verify_jwt = true
[functions.profile-avatar]
verify_jwt = true
[functions.profile-settings]
verify_jwt = true
[functions.instagram-account]
verify_jwt = true
[functions.instagram-oauth]
verify_jwt = false
[functions.refresh-publication-metrics]
verify_jwt = true
[functions.sync-instagram-publications]
verify_jwt = false
[functions.share-news]
verify_jwt = false
[functions.sync-instagram-profile]
verify_jwt = true
